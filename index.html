    <style>

        --bg: var(--color-background);
        --ink: var(--color-ink);
        --teal: var(--color-teal);
        --green: var(--color-accent);
        --mint: var(--color-mint);
        --line: #DFE9E5;
        --muted: #647574;
        --white: #FFFFFF;
        --font: var(--font-display), Inter, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: var(--bg); }
      body { color: var(--ink); font-family: var(--font); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      .stage { position: absolute; inset: 0; background: var(--bg); }
      .chapter { position: absolute; left: 150px; top: 48px; z-index: 4; color: var(--teal); }

      .chapter-title { color: var(--teal); font-size: 54px; font-weight: 700; letter-spacing: -2px; line-height: 1.05; }

      .site-logo img { width: 36px; height: 36px; object-fit: contain; }
      .site-logo span span { color: var(--green); }
